[project]
name = "pg-plonker"
version = "0.1.0"
description = "pg-plonker is a lightweight PyGame extension for plonking GUI elements down on your PyGame window"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "docstring-tailor>=0.4.1",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]

[tool.ruff.lint]
select = [
    "F",    # Includes removing unused imports
    "I",    # isort-style import sorting
    "ANN",  # Annotation rules
]

[tool.ruff.lint.per-file-ignores]
# Tests put two blank lines between imports and the section comments.
"tests/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["pg_plonker"]

[tool.deptry]
known_first_party = ["pg_plonker"]

[tool.docstring_tailor]
line-length = 80
style = "google"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
